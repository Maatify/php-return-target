name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:2.10.2
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --no-interaction --abandoned=fail
      - run: composer check:syntax
      - run: composer check:whitespace
      - run: composer format:check
      - run: composer analyse
      - run: composer check:examples

  tests:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.10.2
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer test:unit
      - run: composer test:system

  lowest:
    name: Lowest Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:2.10.2
          coverage: none
      - run: composer validate --strict
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --no-interaction --abandoned=fail
      - run: composer check:syntax
      - run: composer format:check
      - run: composer analyse
      - run: composer test:unit
      - run: composer test:system
      - run: composer check:examples

  consumer-verification:
    name: Consumer Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:2.10.2
          coverage: none
      - run: composer verify:consumer

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci/run-actionlint.sh

  gate:
    name: Final Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - tests
      - lowest
      - consumer-verification
      - workflow-lint
    steps:
      - name: Require every upstream job to succeed
        if: ${{ needs.quality.result == 'success' && needs.tests.result == 'success' && needs.lowest.result == 'success' && needs.consumer-verification.result == 'success' && needs.workflow-lint.result == 'success' }}
        run: echo 'All required CI jobs succeeded.'
      - name: Fail on failure, cancellation, or skip
        if: ${{ needs.quality.result != 'success' || needs.tests.result != 'success' || needs.lowest.result != 'success' || needs.consumer-verification.result != 'success' || needs.workflow-lint.result != 'success' }}
        run: exit 1
